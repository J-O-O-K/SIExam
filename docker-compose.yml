version: '3.8'

# Anchors
x-restart-policy: &restart-policy
  restart: unless-stopped

services:
  # SQL Server Database
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=P@ssword1
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - siexam-network
    <<: *restart-policy

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - siexam-network
    <<: *restart-policy

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: src/Services/AuthService/AuthService.API/Dockerfile
    container_name: auth-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5001:8080"
    depends_on:
      - mssql
    networks:
      - siexam-network
    <<: *restart-policy

  # Catalog Service
  catalog-service:
    build:
      context: .
      dockerfile: src/Services/CatalogService/CatalogService.API/Dockerfile
    container_name: catalog-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5002:8080"
    depends_on:
      - mssql
      - rabbitmq
    networks:
      - siexam-network
    <<: *restart-policy

  # Lending Service
  lending-service:
    build:
      context: .
      dockerfile: src/Services/LendingService/LendingService.API/Dockerfile
    container_name: lending-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5003:8080"
    depends_on:
      - mssql
      - rabbitmq
    networks:
      - siexam-network
    <<: *restart-policy

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: src/Gateway/ApiGateway/Dockerfile
    container_name: api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - catalog-service
      - lending-service
    networks:
      - siexam-network
    <<: *restart-policy

volumes:
  mssql-data:

networks:
  siexam-network:
    driver: bridge